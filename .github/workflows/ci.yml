name: اختبارات وبناء

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: تشغيل الاختبارات
        run: npm test

      # الملفات المبنية متسجّلة في المستودع لأن النشر بيتم برفع ملفات ثابتة.
      # الخطوة دي بتتأكد إنها متطابقة مع المصدر — يعني محدش عدّل app.src.jsx
      # ورفع من غير ما يشغّل npm run build، وهو أسهل غلط ممكن يحصل في المشروع ده.
      - name: التأكد إن الملفات المبنية محدّثة
        run: |
          npm run build
          if ! git diff --quiet -- app.js index.html sw.js vendor; then
            echo "::error::الملفات المبنية مش محدّثة. شغّل 'npm run build' واعمل commit للناتج."
            git diff --stat -- app.js index.html sw.js vendor
            exit 1
          fi
          echo "✓ الملفات المبنية متطابقة مع المصدر"
